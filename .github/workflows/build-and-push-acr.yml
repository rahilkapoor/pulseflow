name: Build and Push to ACR

on:
  push:
    branches: [ "deploy/wardrobe" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: closet
            dockerfile: ./closet/Dockerfile
            context: ./closet
          - name: wardrobe
            dockerfile: ./wardrobe/Dockerfile
            context: ./wardrobe
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push ${{ matrix.service.name }} image
        run: |
          docker build ${{ matrix.service.context }} -f ${{ matrix.service.dockerfile }} -t ${{ secrets.ACR_LOGIN_SERVER }}/${{ matrix.service.name }}:${{ github.sha }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/${{ matrix.service.name }}:${{ github.sha }}
          docker tag ${{ secrets.ACR_LOGIN_SERVER }}/${{ matrix.service.name }}:${{ github.sha }} ${{ secrets.ACR_LOGIN_SERVER }}/${{ matrix.service.name }}:latest
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/${{ matrix.service.name }}:latest
