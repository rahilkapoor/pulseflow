name: Wardrobe Workflow

on:
  push:
    branches:
      - deploy/wardrobe
  pull_request:
    branches:
      - deploy/wardrobe
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./wardrobe/package-lock.json

      - name: Install dependencies
        working-directory: ./wardrobe
        run: npm install

      - name: Build Next.js app
        working-directory: ./wardrobe
        run: npm run build

      - name: Clean up unnecessary files
        working-directory: ./wardrobe
        run: |
          rm -rf .next/.cache
          rm -rf node_modules/.cache

      - name: Create deployment package
        run: |
          cd ./wardrobe
          # Clean up unnecessary files
          rm -rf .next/.cache node_modules/.cache
          cd ..
          # Create tarball with all necessary files including node_modules
          tar --exclude='wardrobe/.git' \
            --exclude='wardrobe/.gitignore' \
            --exclude='wardrobe/.env.local' \
            --exclude='wardrobe/.env' \
            --exclude='wardrobe/.*' \
            -czf wardrobe-deploy.tar.gz wardrobe/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wardrobe-app
          path: wardrobe-deploy.tar.gz

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: wardrobe-app

      - name: Extract deployment package
        run: |
          tar -xzf wardrobe-deploy.tar.gz
          rm wardrobe-deploy.tar.gz

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B44DE2EEA19F47D4A50EF4F105FD4E27 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_E4097A4D4E20444EBA1AE1212477A12C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_D6D20173DDD341F68C101F13DBD1F3AF }}

      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: wardrobe
          slot-name: Production
          package: ./wardrobe