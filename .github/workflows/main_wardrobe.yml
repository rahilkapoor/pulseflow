name: Build and deploy Node.js app to Azure Web App - wardrobe

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: ./wardrobe

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B44DE2EEA19F47D4A50EF4F105FD4E27 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_E4097A4D4E20444EBA1AE1212477A12C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_D6D20173DDD341F68C101F13DBD1F3AF }}

      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: wardrobe
          slot-name: Production
          package: .