# default configuration for closet
server.port=8080
server.servlet.context-path=/

# MongoDB configuration - use environment variable if available
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/closet}
spring.data.mongodb.auto-index-creation=true

# Logging configuration
logging.level.root=INFO
logging.level.com.example.closet=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Server configuration for running in containers
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

